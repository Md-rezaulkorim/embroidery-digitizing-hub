<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard | Embroidery Digitizing Hub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .login-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .login-box h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .login-box p {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      cursor: pointer;
    }

    .login-btn,
    .publish-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
    }

    .login-btn:hover,
    .publish-btn:hover {
      background: #333;
    }

    #loginMessage,
    #status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      display: none;
    }

    .dashboard {
      display: none;
    }

    .admin-header {
      background: #111;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-header h1 {
      font-size: 22px;
    }

    .logout-btn {
      background: white;
      color: #111;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-bottom: 25px;
    }

    @media (max-width: 600px) {
      .admin-header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }

      .card,
      .login-box {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN SECTION -->

  <section class="login-section" id="loginSection">

    <div class="login-box">

      <h1>Admin Login</h1>

      <p>Embroidery Digitizing Hub</p>

      <form id="loginForm">

        <div class="form-group">

          <label>Email</label>

          <input
            type="email"
            id="email"
            placeholder="Enter admin email"
            required
          >

        </div>

        <div class="form-group">

          <label>Password</label>

          <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
          >

        </div>

        <button type="submit" class="login-btn">
          Login
        </button>

        <div id="loginMessage"></div>

      </form>

    </div>

  </section>


  <!-- ADMIN DASHBOARD -->

  <section class="dashboard" id="dashboard">

    <header class="admin-header">

      <h1>Embroidery Digitizing Hub</h1>

      <button class="logout-btn" id="logoutBtn">
        Logout
      </button>

    </header>


    <main class="container">

      <div class="card">

        <h2>Add New Portfolio</h2>

        <form id="portfolioForm">

          <div class="form-group">

            <label>Project Title</label>

            <input
              type="text"
              id="title"
              placeholder="Example: 3D Puff Logo"
              required
            >

          </div>


          <div class="form-group">

            <label>Category</label>

            <select id="category" required>

              <option value="">
                Select Category
              </option>

              <option value="3D Puff">
                3D Puff
              </option>

              <option value="Applique">
                Applique
              </option>

              <option value="Logo">
                Logo
              </option>

              <option value="Cap / Hat">
                Cap / Hat
              </option>

              <option value="Patch">
                Patch
              </option>

              <option value="Jacket Back">
                Jacket Back
              </option>

            </select>

          </div>


          <div class="form-group">

            <label>Project Description</label>

            <textarea
              id="description"
              placeholder="Write project details..."
              required
            ></textarea>

          </div>


          <div class="form-group">

            <label>Portfolio Image</label>

            <input
              type="file"
              id="image"
              accept="image/*"
              required
            >

          </div>


          <button
            type="submit"
            class="publish-btn"
          >
            Publish Portfolio
          </button>

          <div id="status"></div>

        </form>

      </div>

    </main>

  </section>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /*
      ==========================================
      SUPABASE CONNECTION
      ==========================================
    */

    const SUPABASE_URL = "https://vzuwofldfzhmvxtwnswu.supabase.co";

    const SUPABASE_KEY = "sb_publishable_55q7wLiEG-Ux7bWN1IgwYQ_ro9LHUcP";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /*
      ==========================================
      LOGIN
      ==========================================
    */

    const loginForm =
      document.getElementById("loginForm");

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email").value;

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("loginMessage");

        message.style.display = "block";

        message.textContent = "Logging in...";


        const { data, error } =
          await supabaseClient.auth.signInWithPassword({

            email: email,
            password: password

          });


        if (error) {

          message.textContent =
            "Login failed: " + error.message;

          return;
        }


        message.style.display = "none";

        showDashboard();

      }
    );


    /*
      ==========================================
      SHOW DASHBOARD
      ==========================================
    */

    function showDashboard() {

      document.getElementById(
        "loginSection"
      ).style.display = "none";


      document.getElementById(
        "dashboard"
      ).style.display = "block";

    }


    /*
      ==========================================
      LOGOUT
      ==========================================
    */

    document.getElementById(
      "logoutBtn"
    ).addEventListener(
      "click",
      async function() {

        await supabaseClient.auth.signOut();

        document.getElementById(
          "dashboard"
        ).style.display = "none";


        document.getElementById(
          "loginSection"
        ).style.display = "flex";

      }
    );


    /*
      ==========================================
      CHECK EXISTING LOGIN
      ==========================================
    */

    async function checkUser() {

      const {
        data: {
          session
        }
      } = await supabaseClient.auth.getSession();


      if (session) {

        showDashboard();

      }

    }


    checkUser();


    /*
      ==========================================
      PORTFOLIO
      ==========================================
    */

        document.getElementById("portfolioForm").addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const title = document.getElementById("title").value.trim();
    const category = document.getElementById("category").value;
    const description = document.getElementById("description").value.trim();
    const imageFile = document.getElementById("image").files[0];
    const status = document.getElementById("status");
    const publishButton = document.querySelector(".publish-btn");

    if (!title || !category || !description || !imageFile) {
      status.style.display = "block";
      status.textContent = "Please fill in all fields.";
      return;
    }

    try {

      publishButton.disabled = true;
      publishButton.textContent = "Publishing...";

      status.style.display = "block";
      status.textContent = "Uploading image...";

      // Create unique file name
      const fileName =
        Date.now() + "-" +
        imageFile.name.replace(/\s+/g, "-");

      // Upload image to Supabase Storage
      const { error: uploadError } =
        await supabaseClient
          .storage
          .from("portfolio-images")
          .upload(fileName, imageFile);

      if (uploadError) {
        throw uploadError;
      }

      // Get public image URL
      const { data: publicUrlData } =
        supabaseClient
          .storage
          .from("portfolio-images")
          .getPublicUrl(fileName);

      const imageUrl = publicUrlData.publicUrl;

      status.textContent = "Saving project...";

      // Save project to portfolio table
      const { error: databaseError } =
        await supabaseClient
          .from("Portfolio")
          .insert([
            {
              title: title,
              category: category,
              description: description,
              image_url: imageUrl
            }
          ]);

      if (databaseError) {
        throw databaseError;
      }

      // Success
      status.textContent =
        "Project published successfully!";

      status.style.background = "#e8f7e8";
      status.style.color = "#176b17";

      // Reset form
      document.getElementById("portfolioForm").reset();

    } catch (error) {

      console.error(error);

      status.style.display = "block";
      status.style.background = "#ffe8e8";
      status.style.color = "#b00000";

      status.textContent =
        "Publish failed: " + error.message;

    } finally {

      publishButton.disabled = false;
      publishButton.textContent = "Publish Portfolio";

    }

  }
);
  </script>

</body>
</html>
