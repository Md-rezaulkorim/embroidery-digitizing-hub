<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard | Embroidery Digitizing Hub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .admin-header {
      background: #111;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-header h1 {
      font-size: 22px;
    }

    .logout-btn {
      background: #fff;
      color: #111;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .upload-btn {
      width: 100%;
      padding: 14px;
      background: #111;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .upload-btn:hover {
      background: #333;
    }

    #status {
      margin-top: 20px;
      padding: 12px;
      display: none;
      border-radius: 6px;
    }

    @media (max-width: 600px) {
      .admin-header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }

      .card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <header class="admin-header">
    <h1>Embroidery Digitizing Hub</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <main class="container">

    <div class="card">

      <h2>Add New Portfolio</h2>

      <form id="portfolioForm">

        <div class="form-group">
          <label>Project Title</label>
          <input
            type="text"
            id="title"
            placeholder="Example: 3D Puff Logo"
            required
          >
        </div>

        <div class="form-group">
          <label>Category</label>

          <select id="category" required>
            <option value="">Select Category</option>
            <option value="3D Puff">3D Puff</option>
            <option value="Applique">Applique</option>
            <option value="Logo">Logo</option>
            <option value="Cap / Hat">Cap / Hat</option>
            <option value="Patch">Patch</option>
            <option value="Jacket Back">Jacket Back</option>
          </select>

        </div>

        <div class="form-group">

          <label>Project Description</label>

          <textarea
            id="description"
            placeholder="Write project details..."
            required
          ></textarea>

        </div>

        <div class="form-group">

          <label>Portfolio Image</label>

          <input
            type="file"
            id="image"
            accept="image/*"
            required
          >

        </div>

        <button type="submit" class="upload-btn">
          Publish Portfolio
        </button>

        <div id="status"></div>

      </form>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    // Supabase connection will be added in the next step.

    function logout() {
      alert("Logout system will be connected next.");
    }

  </script>

</body>
</html>
